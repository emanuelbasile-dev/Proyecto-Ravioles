  <h1>Ravioles de Ricota</h1>

  <figure>
    <img src="../assets/60ebed4d4c137906d6f1a5761d0d735c_3_3_photojpg.webp" alt="Ravioles rellenos de ricota fresca" width="150" height="150">
    <figcaption>Ravioles <mark>caseros</mark> rellenos de ricota y espinaca</figcaption> <!--mark permite resltar algo importante-->
  </figure> <!--Figure y Figueracption le dan cotexto semnatico a la imagen, se le puede agrupar un texto-->

  <h2>Ingredientes</h2>
  <ul>
    <li><em>500g de ricota</em></li>
    <li><em>200g de espinaca</em></li>
    <li><em>Harina y huevos para la masa</em></li>
  </ul>

  <h2>Pasos</h2>
  <ol>
    <li><i>Preparar la masa con harina y huevos.</i></li>
    <li><i>Mezclar la ricota con espinaca.</i></li>
    <li><i>Armar los ravioles y hervir.</i></li>
  </ol>
